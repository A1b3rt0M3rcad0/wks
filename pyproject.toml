[project]
name = "woobe-knowledge-service"
version = "0.2.0"
description = "WKS workspace: reusable core and standalone API/frontend"
requires-python = ">=3.12"
dependencies = ["wks-api==0.2.0"]

[project.optional-dependencies]
docling = ["wks-core[docling]"]
asr = ["wks-core[asr]"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "reportlab>=4,<5", "moto[s3]>=5,<6"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/wks-core", "packages/wks-api"]

[tool.uv.sources]
wks-api = { workspace = true }
wks-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
