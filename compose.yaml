services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: wks
      POSTGRES_PASSWORD: ${WKS_POSTGRES_PASSWORD:-wks-local}
      POSTGRES_DB: wks
    ports:
      - "127.0.0.1:${WKS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wks -d wks"]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    image: ${WKS_IMAGE:-wks-api:local}
    build:
      context: .
      dockerfile: Dockerfile.api
      target: base
    environment: &environment
      WKS_DATABASE_URL: postgresql+psycopg://wks:${WKS_POSTGRES_PASSWORD:-wks-local}@postgres:5432/wks
      WKS_STORAGE_PATH: /app/.local/objects
      WKS_HTTP_HOST: 0.0.0.0
      WKS_OCR_LANGUAGE: por+eng
      WKS_ENV: ${WKS_ENV:-development}
      WKS_WEB_PUBLIC_ORIGIN: ${WKS_WEB_PUBLIC_ORIGIN:-}
      WKS_WEB_SESSION_TTL_SECONDS: ${WKS_WEB_SESSION_TTL_SECONDS:-28800}
      WKS_ASR_ENABLED: ${WKS_ASR_ENABLED:-false}
      WKS_ASR_MODEL_PATH: ${WKS_ASR_MODEL_PATH:-}
      WKS_VIDEO_ENABLED: ${WKS_VIDEO_ENABLED:-false}
      WKS_WEB_CAPTURE_ENABLED: ${WKS_WEB_CAPTURE_ENABLED:-false}
      WKS_DOCLING_ARTIFACTS_PATH: ${WKS_DOCLING_ARTIFACTS_PATH:-}
      WKS_EXTRACTION_PROFILE: ${WKS_EXTRACTION_PROFILE:-native}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
  api:
    image: ${WKS_IMAGE:-wks-api:local}
    environment: *environment
    ports:
      - "127.0.0.1:${WKS_HTTP_PORT:-8080}:8080"
    volumes:
      - objects:/app/.local
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["wks", "api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  worker:
    image: ${WKS_NATIVE_WORKER_IMAGE:-wks-worker-native:local}
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        WKS_WORKER_PROFILE: native
    environment: *environment
    volumes:
      - objects:/app/.local
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["wks-worker-native"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
  worker-media:
    image: ${WKS_MEDIA_WORKER_IMAGE:-wks-worker-media:local}
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        WKS_WORKER_PROFILE: media
        WKS_WORKER_EXTRA: ${WKS_MEDIA_WORKER_EXTRA:-}
    environment: *environment
    volumes:
      - objects:/app/.local
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["wks-worker-media"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
  worker-docling:
    profiles: [docling]
    image: ${WKS_DOCLING_WORKER_IMAGE:-wks-worker-docling:local}
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        WKS_WORKER_PROFILE: docling
        WKS_WORKER_EXTRA: --extra models
    environment: *environment
    volumes:
      - objects:/app/.local
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["wks-worker-docling"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 6G
volumes:
  pgdata:
  objects:
