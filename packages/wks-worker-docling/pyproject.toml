[project]
name = "wks-worker-docling"
version = "0.3.0"
description = "WKS isolated worker-docling processing runtime"
requires-python = ">=3.12"
dependencies = ["wks-worker==0.3.0", "wks-worker-native==0.3.0"]

[project.optional-dependencies]
models = ["docling>=2.60,<3", "torch>=2.14,<2.15", "torchvision>=0.29,<0.30"]

[project.scripts]
wks-worker-docling = "wks_worker_docling.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wks_worker_docling"]

[tool.uv.sources]
wks-worker = { workspace = true }
wks-worker-native = { workspace = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
