[project]
name = "wks-worker-media"
version = "1.2.0"
description = "WKS isolated worker-media processing runtime"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["wks-worker==1.2.0"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2,<2", "av>=15,<16"]

[project.scripts]
wks-worker-media = "wks_worker_media.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wks_worker_media"]

[tool.uv.sources]
wks-worker = { workspace = true }
