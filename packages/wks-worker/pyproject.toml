[project]
name = "wks-worker"
version = "0.3.0"
description = "WKS isolated worker processing runtime"
requires-python = ">=3.12"
dependencies = ["wks-core==0.3.0"]

[project.scripts]
wks-worker = "wks_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wks_worker"]

[tool.uv.sources]
wks-core = { workspace = true }
