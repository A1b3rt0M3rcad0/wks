[project]
name = "wks-core"
version = "0.2.0"
description = "Reusable WKS domain, application, storage and processing engine"
requires-python = ">=3.12"
dependencies = ["pydantic-settings>=2.8,<3", "sqlalchemy>=2.0.40,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "boto3>=1.37,<2", "httpx>=0.28,<1", "pillow>=11,<13", "pypdf>=5,<7", "pypdfium2>=4.30,<6", "python-docx>=1.1,<2", "python-pptx>=1,<2", "trafilatura>=2,<3", "pyyaml>=6,<7"]

[project.optional-dependencies]
docling = ["docling>=2.60,<3", "torch>=2.14,<2.15", "torchvision>=0.29,<0.30"]
asr = ["faster-whisper>=1.2,<2", "av>=15,<16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wks_core"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
