[project]
name = "wks-core"
version = "0.3.0"
description = "Reusable WKS domain, application, storage engine"
requires-python = ">=3.12"
dependencies = ["pydantic-settings>=2.8,<3", "sqlalchemy>=2.0.40,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "boto3>=1.37,<2", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wks_core"]
