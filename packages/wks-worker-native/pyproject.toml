[project]
name = "wks-worker-native"
version = "0.3.0"
description = "WKS isolated worker-native processing runtime"
requires-python = ">=3.12"
dependencies = ["wks-worker==0.3.0", "pillow>=11,<13", "pypdf>=5,<7", "pypdfium2>=4.30,<6", "python-docx>=1.1,<2", "python-pptx>=1,<2", "trafilatura>=2,<3", "pyyaml>=6,<7"]

[project.scripts]
wks-worker-native = "wks_worker_native.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wks_worker_native"]

[tool.uv.sources]
wks-worker = { workspace = true }
