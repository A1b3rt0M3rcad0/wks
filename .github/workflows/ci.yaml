name: WKS checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      revision:
        required: false
        type: string
        default: ''
      version:
        required: false
        type: string
        default: ''
    outputs:
      artifact_id:
        value: ${{ jobs.package.outputs.artifact_id }}
      manifest_sha256:
        value: ${{ jobs.package.outputs.manifest_sha256 }}
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wks
          POSTGRES_PASSWORD: wks-local
          POSTGRES_DB: wks_test
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U wks" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng
      - run: uv sync --frozen --extra docling --extra asr
      - run: uv run --no-sync python scripts/download_models.py
      - run: uv run --no-sync python scripts/download_models.py --docling --destination .local/models/docling
      - run: python scripts/version.py
      - run: make lint
        env:
          UV_CACHE_DIR: /home/runner/.cache/uv
      - run: uv run --no-sync pytest -q --junitxml=results.xml
        env:
          WKS_PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
          HF_HUB_OFFLINE: '1'
          OMP_NUM_THREADS: '2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - run: npm ci --prefix tests/web
      - run: npx playwright install --with-deps chromium
        working-directory: tests/web
      - run: uv run --no-sync python scripts/browser_fixture.py
      - name: Browser contracts with API and real worker
        run: |
          uv run --no-sync python scripts/browser_server.py > .local/browser-api.log 2>&1 &
          api_pid=$!
          uv run --no-sync python scripts/browser_server.py --worker > .local/browser-worker.log 2>&1 &
          worker_pid=$!
          uv run --no-sync python scripts/browser_server.py --accounts > .local/accounts-browser-api.log 2>&1 &
          accounts_pid=$!
          trap 'kill "$api_pid" "$worker_pid" "$accounts_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for port in (8082, 8083):
              for attempt in range(60):
                  try:
                      with urllib.request.urlopen(f'http://127.0.0.1:{port}/health/ready') as response:
                          if response.status == 200:
                              break
                  except OSError:
                      time.sleep(1)
              else:
                  raise RuntimeError('Browser API did not become ready')
          PY
          npm --prefix tests/web test
      - run: tests/web/node_modules/.bin/prettier --check 'packages/wks-api/src/wks_api/web/assets/*' 'tests/web/*.mjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            results.xml
            .local/browser-results.json
            docs/ui-workspace/*.png

  package:
    needs: test
    if: inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
      - run: uv sync --frozen
      - name: Build the candidate from the exact tested revision
        env:
          WKS_RELEASE_VERSION: ${{ inputs.version }}
          WKS_RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          uv run --no-sync python scripts/package_release.py --version "$WKS_RELEASE_VERSION" --revision "$WKS_RELEASE_REVISION"
          uv run --no-sync python scripts/verify_release.py --version "$WKS_RELEASE_VERSION" --revision "$WKS_RELEASE_REVISION"
          uv venv .local/candidate-env --python 3.12
          uv pip install --python .local/candidate-env/bin/python --require-hashes -r dist/api-requirements.txt -r dist/native-requirements.txt
          uv pip install --python .local/candidate-env/bin/python --no-deps dist/wks_core-*.whl dist/wks_api-*.whl dist/wks_worker-*.whl dist/wks_worker_native-*.whl
          .local/candidate-env/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          import wks_api
          from wks_api.http.app import create_app
          from wks_api.version import build_info
          assert Path(wks_api.__file__).resolve().is_relative_to(Path('.local/candidate-env').resolve())
          assert build_info() == {'version': os.environ['WKS_RELEASE_VERSION'], 'commit': os.environ['WKS_RELEASE_REVISION']}
          assert create_app().openapi() == json.loads(Path('dist/openapi.json').read_text())
          print('PASS: installed wheels load the exact candidate API, release version and source revision')
          PY
      - id: manifest
        run: echo "sha256=$(sha256sum dist/release-manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: wks-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
