name: Release WKS
run-name: Release WKS ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || github.sha }}
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Optional exact version for recovery or prerelease; empty calculates automatically
        required: false
        type: string
      revision:
        description: Optional exact master commit for recovery
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-wks
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
      skip: ${{ steps.identity.outputs.skip }}
    steps:
      - name: Require the canonical release source
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          case "$SOURCE_REF" in
            refs/heads/master|refs/tags/v*) ;;
            *) echo "Release requires master or an explicit version tag" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: identity
        env:
          WKS_RELEASE_VERSION: ${{ inputs.version }}
          WKS_RELEASE_REVISION: ${{ inputs.revision || (github.event_name == 'push' && github.sha) || '' }}
          WKS_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/release_identity.py --version "$WKS_RELEASE_VERSION" --revision "$WKS_RELEASE_REVISION" --tag "$WKS_RELEASE_TAG" --output "$GITHUB_OUTPUT"
  validate:
    needs: identity
    if: needs.identity.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yaml
    with:
      version: ${{ needs.identity.outputs.version }}
      revision: ${{ needs.identity.outputs.revision }}
  image:
    needs: [identity, validate]
    if: needs.identity.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, native, docling, media]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
      - run: uv sync --frozen
      - name: Prepare the models for this processor
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          mkdir -p .local/models
          if [[ "$COMPONENT" == docling ]]; then
            uv sync --frozen --extra docling
            uv run --no-sync python scripts/download_models.py --docling --destination .local/models/docling
          elif [[ "$COMPONENT" == media ]]; then
            uv sync --frozen --extra asr
            uv run --no-sync python scripts/download_models.py
          fi
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - name: Verify the candidate received from validation
        env:
          WKS_RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          WKS_RELEASE_REVISION: ${{ needs.identity.outputs.revision }}
          CANDIDATE_SHA256: ${{ needs.validate.outputs.manifest_sha256 }}
        run: python scripts/verify_release.py --version "$WKS_RELEASE_VERSION" --revision "$WKS_RELEASE_REVISION" --manifest-sha256 "$CANDIDATE_SHA256"
      - id: metadata
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
          WKS_RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          WKS_RELEASE_REVISION: ${{ needs.identity.outputs.revision }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          if [[ "$COMPONENT" != api ]]; then image="$image-worker-$COMPONENT"; fi
          echo "ref=$image" >> "$GITHUB_OUTPUT"
          echo "candidate=$image:candidate-${WKS_RELEASE_VERSION}-${WKS_RELEASE_REVISION}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: existing
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.ref }}
          WKS_RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: python scripts/release_registry.py --image "$IMAGE_REF" --version "$WKS_RELEASE_VERSION" --output "$GITHUB_OUTPUT"
      - id: build
        if: steps.existing.outputs.reused != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          target: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.metadata.outputs.candidate }}
          build-args: |
            WKS_VERSION=${{ needs.identity.outputs.version }}
            WKS_COMMIT=${{ needs.identity.outputs.revision }}
            WKS_SOURCE=https://github.com/${{ github.repository }}
      - name: Verify image identity on both platforms and qualify HTTP and first-account setup
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_REF: ${{ steps.metadata.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
          WKS_RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          WKS_RELEASE_REVISION: ${{ needs.identity.outputs.revision }}
        run: |
          uv run --no-sync python - <<'PY'
          import json, os, subprocess
          from sys import path
          path.insert(0, 'scripts')
          from release_registry import inspect, preflight
          component = os.environ['COMPONENT']
          image = os.environ['IMAGE_REF']
          digest = os.environ['IMAGE_DIGEST']
          version, revision = os.environ['WKS_RELEASE_VERSION'], os.environ['WKS_RELEASE_REVISION']
          preflight(image, version, digest)
          manifest = inspect(image+'@'+digest)
          for platform in ('linux/amd64', 'linux/arm64'):
              # Classic Docker cannot store both architectures under one index digest.
              # Pull the immutable child manifest selected from the validated index.
              architecture = platform.split('/')[1]
              child = next(item['digest'] for item in manifest['manifests'] if item['platform']['architecture'] == architecture)
              command = ['wks','version'] if component == 'api' else ['wks-worker-'+component,'--version']
              actual = subprocess.check_output(['docker','run','--rm','--platform',platform,image+'@'+child,*command], text=True)
              assert json.loads(actual) == {'version':version,'commit':revision}
          Path = __import__('pathlib').Path
          Path('.local/images').mkdir(parents=True, exist_ok=True)
          Path('.local/images/'+component+'.json').write_text(json.dumps({'component':component,'image':image,'digest':digest}))
          PY
          if [[ "$COMPONENT" != api ]]; then
            uv run --no-sync python scripts/qualify_worker_image.py --image "$IMAGE_REF@$IMAGE_DIGEST" --component "$COMPONENT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wks-image-${{ matrix.component }}
          path: .local/images/*.json
          if-no-files-found: error
  qualify:
    needs: [identity, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.revision }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: wks-image-*
          merge-multiple: true
          path: .local/images
      - name: Qualify API and independently deployed native and media workers
        env:
          WKS_RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          WKS_RELEASE_REVISION: ${{ needs.identity.outputs.revision }}
        run: |
          uv run --no-sync python scripts/smoke_release_image.py --images .local/images --version "$WKS_RELEASE_VERSION" --revision "$WKS_RELEASE_REVISION"
  publish:
    needs: [identity, validate, image, qualify]
    if: needs.identity.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.revision }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: wks-image-*
          merge-multiple: true
          path: .local/images
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish immutable tag, GitHub Release and validated GHCR image
        env:
          GH_TOKEN: ${{ github.token }}
          WKS_RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          WKS_RELEASE_REVISION: ${{ needs.identity.outputs.revision }}
          CANDIDATE_SHA256: ${{ needs.validate.outputs.manifest_sha256 }}
          TAGGED_SOURCE: ${{ github.ref_type == 'tag' }}
        run: |
          flags=()
          if [[ "$TAGGED_SOURCE" == true ]]; then flags+=(--tagged-source); fi
          python scripts/publish_release.py --version "$WKS_RELEASE_VERSION" --revision "$WKS_RELEASE_REVISION" --manifest-sha256 "$CANDIDATE_SHA256" --images .local/images "${flags[@]}"
          {
            echo "WKS $WKS_RELEASE_VERSION from $WKS_RELEASE_REVISION"
            echo "GitHub Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$WKS_RELEASE_VERSION"
            echo "GHCR API and native/Docling/media worker images: ghcr.io/${GITHUB_REPOSITORY,,}:$WKS_RELEASE_VERSION"
            echo "Open /app/ and create the first account on an empty installation."
          } >> "$GITHUB_STEP_SUMMARY"
